[package]
name = "m2c-pipeline"
version = "0.1.0"
edition = "2024"
authors = ["Anthony C. @01110100chony"]
license = "Apache-2.0"
description = "Experimental mainframe-to-cloud data pipeline in Rust"

[dependencies]
arrow-array = "53"
arrow-schema = "53"
parquet = { version = "53", default-features = false, features = ["arrow"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10.9"

[dev-dependencies]
proptest = { version = "1", default-features = false, features = ["std"] }
